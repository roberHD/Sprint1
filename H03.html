<!DOCTYPE html>
<html>
<head>
    <title>Confirmar Pedido</title>
    <style>
        .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 10px; }
        .col-6 { flex: 0 0 50%; max-width: 50%; padding: 0 10px; }
        body { font-family: Arial; padding: 20px; }
        @media (max-width: 768px) { .col-6 { flex: 0 0 100%; max-width: 100%; } }
    </style>
</head>
<body>
    <div class="row">
        <div class="col-12">Menu</div> 
    </div>
    <div class="row">
        <div class="col-6">Wrap Italiano</div>
        <div class="col-6">$10.999</div> 
    </div>
    <div class="row">
        <div class="col-6">
            <div style="width: 100px; height: 100px; background: #f0f0f0;">Foto Producto</div>
        </div>
        <div class="col-6">Retiro en tienda</div> 
    </div>
    <div class="row">
        <div class="col-12">Medio de pago: Visa Débito</div> 
    </div>
    <div class="row">
        <div class="col-12">
            <button>Confirmar pedido</button>
        </div>
    </div>
    <div class="row" style="display: none;"> 
        <div class="col-12">Pedido confirmado con éxito</div>
        <div class="col-12">Número de seguimiento</div>
    </div>
</body>
</html>
