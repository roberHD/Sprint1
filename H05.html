<!DOCTYPE html>
<html>
<head>
    <title>Perfil</title>
    <style>
        .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 10px; }
        .col-6 { flex: 0 0 50%; max-width: 50%; padding: 0 10px; }
        body { font-family: Arial; padding: 20px; }
        @media (max-width: 768px) { .col-6 { flex: 0 0 100%; max-width: 100%; } }
    </style>
</head>
<body>
    <div class="row">
        <div class="col-12">Perfil</div> 
    </div>
    <div class="row">
        <div class="col-12">
            <label>Nombre:</label><br>
            <input type="text" placeholder="Nombre usuario">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <label>Contraseña:</label><br>
            <input type="password" placeholder="Contraseña usuario">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <label>Teléfono:</label><br>
            <input type="tel" placeholder="Teléfono usuario">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <label>Correo:</label><br>
            <input type="email" placeholder="Correo usuario">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <label>Dirección:</label><br>
            <input type="text" placeholder="Dirección usuario">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <button>Guardar cambios</button>
        </div>
    </div>
    <div class="row" style="display: none;"> 
        <div class="col-12">Datos actualizados correctamente</div>
    </div>
</body>
</html>
