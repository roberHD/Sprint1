<!DOCTYPE html>
<html>
<head>
    <title>Menu Wrap Italiano</title>
    <style>
        .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 10px; }
        .col-6 { flex: 0 0 50%; max-width: 50%; padding: 0 10px; }
        body { font-family: Arial; padding: 20px; }
    </style>
</head>
<body>
    <div class="row">
        <div class="col-12">Menu</div> <!-- Título full -->
    </div>
    <div class="row">
        <div class="col-6"> <!-- Izquierda: Foto/Producto -->
            <div style="width: 200px; height: 150px; background: #f0f0f0; margin-bottom: 10px;">Foto Producto</div>
            <div>Producto</div>
        </div>
        <div class="col-6"> <!-- Derecha: Detalles -->
            <div>Wrap Italiano</div>
            <div>$10.999</div>
            <div>Ingredientes:</div>
            <div>Choclo</div>
            <div>Pollo</div>
            <div>Palta</div>
            <div>Tomate</div>
            <button>Agregar al carrito</button>
        </div>
    </div>
</body>
</html>
