<!DOCTYPE html>
<html>
<head>
    <title> Stock</title>
    <style>
        .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 10px; }
        body { font-family: Arial; padding: 20px; }
        @media (max-width: 768px) { .col-12 { flex: 0 0 100%; max-width: 100%; } }
    </style>
</head>
<body>
    <div class="row">
        <div class="col-12">Stock</div> 
    </div>
    <div class="row">
        <div class="col-12">Registro de entrada de insumo</div>
    </div>
    <div class="row">
        <div class="col-12">
            <label>Compra de 10 kg de jamón</label><br>
            <input type="text" value="Compra de 10 kg de jamón">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <button>Registrar compra</button>
        </div>
    </div>
    <div class="row" style="display: none;"> 
        <div class="col-12">Stock actualizado</div>
    </div>
</body>
</html>
