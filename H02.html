<!DOCTYPE html>
<html>
<head>
    <title>Detalle Wrap Italiano</title>
    <style>
        .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 10px; }
        .col-6 { flex: 0 0 50%; max-width: 50%; padding: 0 10px; }
        body { font-family: Arial; padding: 20px; }
    </style>
</head>
<body>
    <div class="row">
        <div class="col-12">Menu</div> 
    </div>
    <div class="row">
        <div class="col-6"> 
            <div style="width: 200px; height: 150px; background: #f0f0f0; margin-bottom: 10px;">Foto Producto</div>
            <div>Producto</div>
        </div>
        <div class="col-6">
            <div>Wrap Italiano</div>
            <div>$10.999</div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">Agregar/Quitar ingredientes:</div> 
    <div class="row">
        <div class="col-6">
            <label>Ingrediente 1</label><br>
            <input type="checkbox">
        </div>
        <div class="col-6">
            <label>Ingrediente 2</label><br>
            <input type="checkbox">
        </div>
    </div>
    <div class="row">
        <div class="col-6">
            <label>Ingrediente 3</label><br>
            <input type="checkbox">
        </div>
        <div class="col-6">
            <label>Ingrediente 4</label><br>
            <input type="checkbox">
        </div>
    </div>
    <div class="row">
        <div class="col-6">
            <label>Ingrediente 5</label><br>
            <input type="checkbox">
        </div>
        <div class="col-6">
            <label>Ingrediente 6</label><br>
            <input type="checkbox">
        </div>
    </div>
    <div class="row">
        <div class="col-12">Precio actualizado: $precio</div> 
    </div>
</body>
</html>
